<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Waveform 1 (composite square-like) -->
  <path d="M 40 320
           C 60 320, 80 320, 100 320
           L 100 220
           L 140 220
           L 140 420
           L 180 420
           L 180 220
           L 220 220
           L 220 420
           L 260 420
           L 260 120
           L 300 120
           L 300 520
           L 340 520
           L 340 120
           L 380 120
           L 380 520
           L 420 520
           L 420 220
           L 460 220
           L 460 420
           L 500 420
           L 500 220
           L 540 220
           L 540 420
           L 580 420
           L 580 320
           C 600 320, 620 320, 640 320"
        fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Waveform 2 (individual harmonic) -->
  <g transform="translate(680, 0)">
    <path d="M 40 320
             A 120 120 0 0 1 280 320
             A 120 120 0 0 1 520 320
             A 60 60 0 0 1 640 320"
          fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Waveform 3 (another harmonic) -->
  <g transform="translate(0, 0)">
    <path d="M 680 420
             A 80 60 0 0 1 840 420
             A 80 60 0 0 1 1000 420
             A 80 60 0 0 1 1160 420
             A 40 30 0 0 1 1240 420"
          fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="800" font-size="56" fill="#ffffff">
    Fourier Series
  </text>
  <text x="640" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#8892b0">
    Harmonic Waveform Visualizer
  </text>

  <!-- Badge -->
  <rect x="540" y="565" width="200" height="40" rx="20" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="640" y="592" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6366f1">
    🧮 Math Project
  </text>
</svg>
