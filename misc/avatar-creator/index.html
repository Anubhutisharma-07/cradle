<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar Creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Avatar Creator</h1>

  <div class="container">
    <!-- Live preview -->
    <div id="avatar-preview">
      <svg id="avatar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect id="bg" x="0" y="0" width="200" height="200" fill="#a1e3ff" />
        <!-- Face -->
        <circle id="face" cx="100" cy="100" r="60" fill="#f1c27d" />
        <!-- Hair (shape swapped via JS) -->
        <path id="hair" d="M40,80 Q100,10 160,80 Z" fill="#3b2f2f" />
        <!-- Eyes -->
        <circle id="eye-left" cx="80" cy="100" r="6" fill="#000" />
        <circle id="eye-right" cx="120" cy="100" r="6" fill="#000" />
      </svg>
    </div>

    <!-- Controls -->
    <div id="controls">
      <label>
        Background Color:
        <input type="color" id="bg-color" value="#a1e3ff">
      </label>

      <label>
        Skin Tone:
        <input type="color" id="skin-color" value="#f1c27d">
      </label>

      <label>
        Hair Color:
        <input type="color" id="hair-color" value="#3b2f2f">
      </label>

      <label>
        Hair Style:
        <select id="hair-style">
          <option value="0">Bowl Cut</option>
          <option value="1">Spiky</option>
          <option value="2">Bald</option>
        </select>
      </label>

      <button id="randomize-btn">🎲 Randomize</button>
      <button id="download-btn">Download Avatar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
